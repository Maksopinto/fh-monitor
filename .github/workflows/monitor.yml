name: FH Monitor

on:
  schedule:
    - cron: "*/10 5-21 * * *"   # кожні 10 хв, 7:00–23:59 за Києвом (UTC+2)
  workflow_dispatch:            # кнопка «Run workflow» для ручного запуску

permissions:
  contents: write

concurrency:
  group: fh-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Check Freelancehunt
        env:
          FH_TOKEN: ${{ secrets.FH_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python monitor.py
      - name: Save state
        if: always()
        run: |
          git config user.name "fh-monitor"
          git config user.email "fh-monitor@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "state update" && git push)
